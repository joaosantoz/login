spring:
  application:
    name: sistema
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sistema}
    username: ${DB_USER:sistema}
    password: ${DB_PASSWORD:sistema}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.sql
  web:
    locale: pt_BR
    locale-resolver: fixed
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:sistema-api}
    ttl: ${JWT_TTL:30m}
  seed:
    enabled: ${SEED_ENABLED:false}
    password: ${SEED_PASSWORD:Senha@123}
